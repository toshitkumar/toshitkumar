<svg width="100%" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A13" />
      <stop offset="50%" stop-color="#0D1527" />
      <stop offset="100%" stop-color="#080C16" />
    </linearGradient>

    <!-- Title Blue Gradient -->
    <linearGradient id="titleBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#00A8FF" />
      <stop offset="80%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8FF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#1E40AF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Pill Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0C4A6E" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.6" />
    </linearGradient>

    <!-- Blue Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 2.5px;
      fill: url(#titleBlue);
    }
    .subtitle-text {
      font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1.8px;
      fill: #CBD5E1;
    }
    .badge-text {
      font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 1.2px;
      fill: #38BDF8;
    }
    .dot {
      fill: #00D2FF;
    }
  </style>

  <!-- Container Box with Rounded Corners -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" stroke="#1E3A8A" stroke-width="1.5" />

  <!-- Background Cyber Ambient Glows -->
  <circle cx="150" cy="50" r="140" fill="#0284C7" opacity="0.12" filter="url(#glow)" />
  <circle cx="780" cy="70" r="150" fill="#3B82F6" opacity="0.12" filter="url(#glow)" />
  <circle cx="450" cy="180" r="180" fill="#1D4ED8" opacity="0.10" filter="url(#glow)" />

  <!-- Background Tech Grid Lines -->
  <g opacity="0.06" stroke="#38BDF8" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="240" />
    <line x1="150" y1="0" x2="150" y2="240" />
    <line x1="250" y1="0" x2="250" y2="240" />
    <line x1="350" y1="0" x2="350" y2="240" />
    <line x1="450" y1="0" x2="450" y2="240" />
    <line x1="550" y1="0" x2="550" y2="240" />
    <line x1="650" y1="0" x2="650" y2="240" />
    <line x1="750" y1="0" x2="750" y2="240" />
    <line x1="850" y1="0" x2="850" y2="240" />
    <line x1="0" y1="60" x2="900" y2="60" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="180" x2="900" y2="180" />
  </g>

  <!-- Flowing Waves at the Bottom -->
  <path d="M0 190 C 200 160, 400 230, 600 180 C 750 145, 830 195, 900 185 L 900 240 L 0 240 Z" fill="url(#waveGrad1)" />
  <path d="M0 205 C 180 185, 380 235, 580 200 C 740 170, 820 220, 900 200 L 900 240 L 0 240 Z" fill="url(#waveGrad2)" />
  
  <!-- Subtle Glowing Horizon Line -->
  <path d="M0 205 C 180 185, 380 235, 580 200 C 740 170, 820 220, 900 200" fill="none" stroke="#00D2FF" stroke-width="1.8" opacity="0.6" filter="url(#softGlow)" />

  <!-- Main Title: TOSHIT KUMAR CHAUHAN (Vibrant Blue) -->
  <text x="450" y="82" text-anchor="middle" class="title-text" filter="url(#softGlow)">TOSHIT KUMAR CHAUHAN</text>

  <!-- Subtitle: Roles -->
  <text x="450" y="122" text-anchor="middle" class="subtitle-text">
    ICT TRAINER <tspan class="dot">•</tspan> WEB DEVELOPER <tspan class="dot">•</tspan> GAME DEVELOPER <tspan class="dot">•</tspan> AI SPECIALIST
  </text>

  <!-- Interactive/Pill Status Badges -->
  <g transform="translate(145, 142)">
    <!-- Badge 1: ICT360 -->
    <rect x="0" y="0" width="180" height="28" rx="14" fill="url(#badgeGrad)" stroke="#0284C7" stroke-width="1" />
    <text x="90" y="18" text-anchor="middle" class="badge-text">🏫 50+ Schools Trained</text>

    <!-- Badge 2: Full-Stack & AI -->
    <rect x="195" y="0" width="220" height="28" rx="14" fill="url(#badgeGrad)" stroke="#2563EB" stroke-width="1" />
    <text x="305" y="18" text-anchor="middle" class="badge-text">⚡ AI &amp; Robotics Builder</text>

    <!-- Badge 3: YouTube -->
    <rect x="430" y="0" width="180" height="28" rx="14" fill="url(#badgeGrad)" stroke="#38BDF8" stroke-width="1" />
    <text x="520" y="18" text-anchor="middle" class="badge-text">🎬 Tech with Toshit</text>
  </g>
</svg>
