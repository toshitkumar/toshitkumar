<svg width="100%" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#070A14" />
    </linearGradient>

    <!-- Animated Title Blue Gradient -->
    <linearGradient id="titleBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8; #00D2FF; #60A5FA; #38BDF8" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#00A8FF">
        <animate attributeName="stop-color" values="#00A8FF; #38BDF8; #00D2FF; #00A8FF" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB; #1D4ED8; #0284C7; #2563EB" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Wave Gradient 1 -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8FF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.25" />
    </linearGradient>

    <!-- Wave Gradient 2 -->
    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#1E40AF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.45" />
    </linearGradient>

    <!-- Pill Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#082F49" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#172554" stop-opacity="0.7" />
    </linearGradient>

    <!-- Blue Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 41px;
      font-weight: 800;
      letter-spacing: 2.5px;
      fill: url(#titleBlue);
    }
    .subtitle-text {
      font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1.8px;
      fill: #CBD5E1;
    }
    .badge-text {
      font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 1.2px;
      fill: #38BDF8;
    }
    .dot {
      fill: #00D2FF;
    }
  </style>

  <!-- Container Box with Rounded Corners -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" stroke="#1E3A8A" stroke-width="1.5" />

  <!-- Animated Ambient Glow Spheres -->
  <circle cx="150" cy="50" r="140" fill="#0284C7" filter="url(#glow)">
    <animate attributeName="r" values="130; 165; 130" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.10; 0.22; 0.10" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="780" cy="70" r="150" fill="#3B82F6" filter="url(#glow)">
    <animate attributeName="r" values="135; 175; 135" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.10; 0.22; 0.10" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="450" cy="180" r="180" fill="#1D4ED8" filter="url(#glow)">
    <animate attributeName="r" values="160; 200; 160" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08; 0.18; 0.08" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Background Tech Grid Lines -->
  <g opacity="0.05" stroke="#38BDF8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="240" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="300" y1="0" x2="300" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="500" y1="0" x2="500" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="700" y1="0" x2="700" y2="240" />
    <line x1="800" y1="0" x2="800" y2="240" />
    <line x1="0" y1="60" x2="900" y2="60" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="180" x2="900" y2="180" />
  </g>

  <!-- Animated Flowing Waves at the Bottom -->
  <path fill="url(#waveGrad1)">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="
        M0 190 C 200 160, 400 230, 600 180 C 750 145, 830 195, 900 185 L 900 240 L 0 240 Z;
        M0 185 C 220 210, 420 160, 620 205 C 760 180, 840 160, 900 190 L 900 240 L 0 240 Z;
        M0 190 C 200 160, 400 230, 600 180 C 750 145, 830 195, 900 185 L 900 240 L 0 240 Z
      " />
  </path>
  <path fill="url(#waveGrad2)">
    <animate attributeName="d" dur="5s" repeatCount="indefinite"
      values="
        M0 205 C 180 185, 380 235, 580 200 C 740 170, 820 220, 900 200 L 900 240 L 0 240 Z;
        M0 200 C 200 230, 390 190, 590 225 C 750 195, 830 180, 900 205 L 900 240 L 0 240 Z;
        M0 205 C 180 185, 380 235, 580 200 C 740 170, 820 220, 900 200 L 900 240 L 0 240 Z
      " />
  </path>
  
  <!-- Animated Glowing Horizon Laser Line -->
  <path fill="none" stroke="#00D2FF" stroke-width="2" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.4; 0.9; 0.4" dur="3s" repeatCount="indefinite" />
    <animate attributeName="d" dur="5s" repeatCount="indefinite"
      values="
        M0 205 C 180 185, 380 235, 580 200 C 740 170, 820 220, 900 200;
        M0 200 C 200 230, 390 190, 590 225 C 750 195, 830 180, 900 205;
        M0 205 C 180 185, 380 235, 580 200 C 740 170, 820 220, 900 200
      " />
  </path>

  <!-- Main Title: TOSHIT KUMAR CHAUHAN (Glowing Animated Electric Blue) -->
  <text x="450" y="82" text-anchor="middle" class="title-text" filter="url(#softGlow)">TOSHIT KUMAR CHAUHAN</text>

  <!-- Subtitle: Roles -->
  <text x="450" y="122" text-anchor="middle" class="subtitle-text">
    ICT TRAINER <tspan class="dot">•</tspan> WEB DEVELOPER <tspan class="dot">•</tspan> GAME DEVELOPER <tspan class="dot">•</tspan> AI SPECIALIST
  </text>

  <!-- Pill Status Badges (Rounded) -->
  <g transform="translate(145, 142)">
    <!-- Badge 1: ICT360 -->
    <rect x="0" y="0" width="180" height="28" rx="14" fill="url(#badgeGrad)" stroke="#0284C7" stroke-width="1.2" />
    <text x="90" y="18" text-anchor="middle" class="badge-text">🏫 50+ Schools Trained</text>

    <!-- Badge 2: Full-Stack & AI -->
    <rect x="195" y="0" width="220" height="28" rx="14" fill="url(#badgeGrad)" stroke="#2563EB" stroke-width="1.2" />
    <text x="305" y="18" text-anchor="middle" class="badge-text">⚡ AI &amp; Robotics Builder</text>

    <!-- Badge 3: YouTube -->
    <rect x="430" y="0" width="180" height="28" rx="14" fill="url(#badgeGrad)" stroke="#38BDF8" stroke-width="1.2" />
    <text x="520" y="18" text-anchor="middle" class="badge-text">🎬 Tech with Toshit</text>
  </g>
</svg>
