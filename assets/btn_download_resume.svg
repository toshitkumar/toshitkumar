<svg xmlns="http://www.w3.org/2000/svg" width="240" height="46" viewBox="0 0 240 46" fill="none">
  <defs>
    <linearGradient id="dlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#00A8FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="dlBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.8" />
    </linearGradient>
    <filter id="dlGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Button Background (Full Pill Rounded rx=23) -->
  <rect x="2" y="2" width="236" height="42" rx="21" fill="url(#dlGrad)" stroke="url(#dlBorder)" stroke-width="1.5" filter="url(#dlGlow)" />
  
  <!-- Subtle Top Highlight -->
  <path d="M 23 4 Q 120 12 217 4" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1" fill="none" />

  <!-- Download Icon -->
  <g transform="translate(20, 13)">
    <path d="M 10 2 L 10 13 M 5 9 L 10 14 L 15 9" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 2 16 L 18 16" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Button Text -->
  <text x="50" y="27" fill="#FFFFFF" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">Download Resume</text>
  <text x="188" y="27" fill="#E0F2FE" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="600">(PDF)</text>
</svg>