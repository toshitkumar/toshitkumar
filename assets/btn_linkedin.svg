<svg xmlns="http://www.w3.org/2000/svg" width="230" height="46" viewBox="0 0 230 46" fill="none">
  <defs>
    <linearGradient id="liGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A66C2" />
      <stop offset="100%" stop-color="#004182" />
    </linearGradient>
    <linearGradient id="liBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70B5F9" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.8" />
    </linearGradient>
    <filter id="liGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Button Background (Full Pill Rounded rx=21) -->
  <rect x="2" y="2" width="226" height="42" rx="21" fill="url(#liGrad)" stroke="url(#liBorder)" stroke-width="1.5" filter="url(#liGlow)" />
  
  <!-- Subtle Top Highlight -->
  <path d="M 23 4 Q 115 12 207 4" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" fill="none" />

  <!-- LinkedIn "in" Logo -->
  <g transform="translate(18, 11)">
    <rect width="24" height="24" rx="4" fill="#FFFFFF" />
    <text x="12" y="18" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#0A66C2">in</text>
  </g>

  <!-- Button Text -->
  <text x="54" y="27" fill="#FFFFFF" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.4">Connect on LinkedIn</text>
</svg>
